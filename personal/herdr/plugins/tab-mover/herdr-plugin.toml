# tab-mover — move the active tab, with all its panes and their split layout,
# into another open workspace.
#
# herdr has no cross-workspace tab move: the `tab.move` API only reorders tabs
# inside one workspace. This rebuilds the move out of `pane.move`, which is the
# only call that relocates a live terminal. The source tab closes itself once
# its last pane leaves, and the source workspace closes with it if that was its
# only tab.
#
# Reordering a tab within its workspace is NOT here — herdr's built-in
# keys.move_tab_previous / keys.move_tab_next already do it. See config.toml.
#
# Commands run with the plugin dir as cwd and invoke python3 on tab_mover.py
# (pure stdlib).

id = "sam.tab-mover"
name = "Tab Mover"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Move the active tab and its pane layout to another open workspace."
platforms = ["macos", "linux"]

# Interactive destination picker. `popup` is session-modal and does not disturb
# the tiled layout, so the tab being moved keeps its panes and focus while the
# picker is up — the same surface prefix+? uses.
[[panes]]
id = "pick"
title = "Move tab to workspace"
placement = "popup"
width = "60%"
height = "40%"
command = ["python3", "tab_mover.py", "pick"]

# Keybindings can only reach a plugin through an action, so this opens the
# picker pane. It forwards the active tab id because a popup gets no pane
# context of its own; the picker falls back to the focused tab when the
# variable is absent (e.g. `herdr plugin action invoke`).
# `contexts` is inert today — herdr never renders plugin actions in its native
# menus, and the maintainer closed that request not_planned (herdrdev/herdr#1776,
# #3533). Declared as "tab" anyway because that is what this action operates on,
# and it is the value that would place it in the tab right-click menu if that
# ever reverses.
[[actions]]
id = "pick"
title = "Move tab to workspace"
contexts = ["tab"]
command = ["python3", "tab_mover.py", "open-picker"]
