# wtp — which shop/world pool slot a workspace is sitting in, on the Spaces
# row, plus a picker over the whole pool with a free action.
#
# A slot is claimed exactly when its worktree is on a branch; freeing one
# detaches HEAD. That is one `git worktree list --porcelain` against the pool's
# bare repo for the whole pool, where `_wtp status` takes ten seconds because it
# also computes dirty and unpushed per slot — so the sidebar token and the
# picker list use git, and the slow checks run only in a free confirmation.
#
# The free action shells `_wtp free`, never `dev tree remove`: `dev tree remove`
# deletes the checkout, while `wtp free` detaches HEAD and returns the slot to
# the pool.
#
# Commands run with the plugin dir as cwd and invoke python3 on wtp.py
# (pure stdlib).

id = "sam.wtp"
name = "WTP"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Pool-slot state on the Spaces rows, and a picker with a safe free."
platforms = ["macos", "linux"]

# workspace.created never fires for a workspace that predates this plugin, and
# every workspace predates a server restart. Backfilling all of them once per
# server start is the same code path the event uses, over `workspace list`.
[[startup]]
command = ["python3", "wtp.py", "refresh"]

# `herd` opens a slot with `workspace create --cwd`, so the slot is knowable
# from the workspace's panes as soon as one reports a cwd. The handler polls
# for that, because the event can arrive before the first shell registers.
[[events]]
on = "workspace.created"
command = ["python3", "wtp.py", "on-workspace-created"]

# Keybindings can only reach a plugin through an action, so this opens the
# popup declared below. Bound to prefix+t and ctrl+alt+t in config.toml.
[[actions]]
id = "pick"
title = "WTP pool slots"
contexts = ["workspace"]
command = ["python3", "wtp.py", "open-picker"]

# Recompute every workspace's slot token. Reachable from the picker with
# ctrl-r and from `herdr plugin action invoke sam.wtp.refresh`; deliberately
# unbound, since the picker already carries it and free chords are scarce.
[[actions]]
id = "refresh"
title = "Refresh WTP slot tokens"
contexts = ["workspace"]
command = ["python3", "wtp.py", "refresh"]

# `popup` is session-modal and leaves the tiled layout alone, so the workspace
# being inspected keeps its panes and focus while the picker is up. Tall enough
# for twelve slots plus the confirmation that replaces them.
[[panes]]
id = "pick"
title = "WTP pool slots"
placement = "popup"
width = "70%"
height = "60%"
command = ["python3", "wtp.py", "pick"]
